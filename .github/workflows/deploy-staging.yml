# Deploy the current main branch to the staging Render service.
# Trigger: manual button in the GitHub Actions tab (workflow_dispatch).
#
# Prerequisites (one-time setup):
#   1. Create a second free Render web service called "thavalon-staging"
#      pointing at the same repo/branch, with auto-deploy OFF.
#   2. Create a Deploy Hook for that service (Render Dashboard → Settings).
#   3. Add the hook URL as a GitHub Actions secret: RENDER_STAGING_DEPLOY_HOOK_URL
name: Deploy to Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Trigger staging deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Staging Deploy Hook
        run: |
          response=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}")

          echo "HTTP status: $response"

          if [ "$response" -eq 200 ] || [ "$response" -eq 202 ]; then
            echo "✅ Staging deploy triggered — test at thavalon-staging.onrender.com"
          else
            echo "❌ Failed to trigger staging deploy (HTTP $response)"
            exit 1
          fi
